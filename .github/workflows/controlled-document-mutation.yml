name: GOV-014 Controlled Document Mutation

on:
  push:
    paths:
      - 'Repository/CONTROLLED_MUTATION_REQUEST.json'
      - 'Repository/REP-001_MASTER_INDEX.md'
      - 'Repository/REP-002_REPOSITORY_MAP.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  controlled-mutation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install test runner
        run: python -m pip install --upgrade pytest

      - name: Check mutation request
        id: request
        shell: bash
        run: |
          if [ ! -f Repository/CONTROLLED_MUTATION_REQUEST.json ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No controlled mutation request present; no-op."
            exit 0
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Validate request contract
        if: steps.request.outputs.present == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          req = json.loads(Path('Repository/CONTROLLED_MUTATION_REQUEST.json').read_text(encoding='utf-8'))
          required = ['transaction_id','target_path','source_blob_sha','candidate_builder','candidate_test','expected_changes']
          missing = [k for k in required if k not in req]
          if missing:
              raise SystemExit(f'MISSING_REQUEST_FIELDS={missing}')
          allowed = {
              'Repository/REP-001_MASTER_INDEX.md',
              'Repository/REP-002_REPOSITORY_MAP.md',
          }
          if req['target_path'] not in allowed:
              raise SystemExit('UNAUTHORIZED_TARGET_PATH')
          if not isinstance(req['expected_changes'], int) or req['expected_changes'] < 1:
              raise SystemExit('INVALID_EXPECTED_CHANGES')
          print(json.dumps(req, indent=2))
          PY

      - name: Validate and build candidate
        if: steps.request.outputs.present == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import importlib
          import json
          from pathlib import Path
          import subprocess

          req = json.loads(Path('Repository/CONTROLLED_MUTATION_REQUEST.json').read_text(encoding='utf-8'))
          module_name = req['candidate_builder'].replace('/', '.').replace('.py', '')
          builder = importlib.import_module(module_name)
          if not hasattr(builder, 'build_candidate'):
              raise SystemExit('BUILDER_MISSING_BUILD_CANDIDATE')

          source_path = Path(req['target_path'])
          source = source_path.read_text(encoding='utf-8')
          actual_blob = subprocess.check_output(['git', 'hash-object', str(source_path)], text=True).strip()
          if actual_blob != req['source_blob_sha']:
              raise SystemExit(f"SOURCE_BLOB_SHA_MISMATCH expected={req['source_blob_sha']} actual={actual_blob}")

          candidate, report = builder.build_candidate(source)
          if report['status'] != 'PRE_COMMIT_VALIDATED':
              raise SystemExit('Candidate did not reach PRE_COMMIT_VALIDATED')
          if report['unexpected_changes'] != 0:
              raise SystemExit('Unexpected changes detected')
          if report.get('keep_hash_mismatches'):
              raise SystemExit(f"KEEP_HASH_MISMATCHES={report['keep_hash_mismatches']}")
          if report.get('required_changes_present') != req['expected_changes']:
              raise SystemExit(f"EXPECTED_CHANGES_MISMATCH expected={req['expected_changes']} actual={report.get('required_changes_present')}")

          target_name = source_path.name
          Path(f'/tmp/{target_name}.candidate.md').write_text(candidate, encoding='utf-8')
          Path('/tmp/mutation_report.json').write_text(json.dumps(report, indent=2), encoding='utf-8')
          Path('/tmp/mutation_request.json').write_text(json.dumps(req, indent=2), encoding='utf-8')
          print(json.dumps(report, indent=2))
          PY

          python -m pytest -q "$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('Repository/CONTROLLED_MUTATION_REQUEST.json').read_text())['candidate_test'])
          PY
          )"
          git diff --check

      - name: Apply candidate to working tree
        if: steps.request.outputs.present == 'true'
        shell: bash
        run: |
          target_path=$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('Repository/CONTROLLED_MUTATION_REQUEST.json').read_text())['target_path'])
          PY
          )
          target_name=$(basename "$target_path")
          cp "/tmp/${target_name}.candidate.md" "$target_path"
          git diff --check
          tracked_changed=$(git status --porcelain --untracked-files=no)
          printf '%s\n' "$tracked_changed"
          test "$(printf '%s\n' "$tracked_changed" | wc -l)" -eq 1
          printf '%s\n' "$tracked_changed" | grep -q "^ M $target_path$"

      - name: Commit validated candidate
        if: steps.request.outputs.present == 'true'
        shell: bash
        run: |
          tx_id=$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('/tmp/mutation_request.json').read_text())['transaction_id'])
          PY
          )
          target_path=$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('/tmp/mutation_request.json').read_text())['target_path'])
          PY
          )
          git config user.name "ARGO GOV-014 Mutation Bot"
          git config user.email "argo-governed-mutation@users.noreply.github.com"
          git add "$target_path"
          git rm Repository/CONTROLLED_MUTATION_REQUEST.json
          tracked_changed=$(git status --porcelain --untracked-files=no)
          printf '%s\n' "$tracked_changed"
          test "$(printf '%s\n' "$tracked_changed" | wc -l)" -eq 2
          printf '%s\n' "$tracked_changed" | grep -q "^M  $target_path$"
          printf '%s\n' "$tracked_changed" | grep -q '^D  Repository/CONTROLLED_MUTATION_REQUEST.json$'
          git commit -m "GOV-014 controlled mutation: $tx_id"
          git push origin HEAD:main

      - name: Finalize no-op
        if: steps.request.outputs.present != 'true'
        run: echo "Controlled mutation workflow completed as no-op."
