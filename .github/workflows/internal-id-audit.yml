name: Internal Document-ID Audit

on:
  workflow_dispatch:
  push:
    paths:
      - 'Quality/Integration/internal_document_id_audit.py'
      - 'Quality/Integration/test_internal_document_id_audit.py'
      - 'Quality/Integration/ejr_allocation_vacancy_gate.py'
      - 'Quality/Integration/test_ejr_allocation_vacancy_gate.py'
      - 'Quality/Integration/ejr_ambiguity_source_signature_census.py'
      - 'Quality/Integration/test_ejr_ambiguity_source_signature_census.py'
      - 'Quality/Integration/ejr_h1_pair_chronology.py'
      - 'Quality/Integration/test_ejr_h1_pair_chronology.py'
      - 'Quality/Integration/ejr_h1_multi_chronology.py'
      - 'Quality/Integration/test_ejr_h1_multi_chronology.py'
      - 'Quality/Integration/ejr_h1_namespace_lineage.py'
      - 'Quality/Integration/test_ejr_h1_namespace_lineage.py'
      - 'Quality/Integration/ejr_nonmonotonic_provenance_census.py'
      - 'Quality/Integration/test_ejr_nonmonotonic_provenance_census.py'
      - 'Quality/Integration/ejr_reverse_provenance_census.py'
      - 'Quality/Integration/test_ejr_reverse_provenance_census.py'
      - 'Repository/REP-001_MASTER_INDEX.md'
      - '.github/workflows/internal-id-audit.yml'

jobs:
  internal-id-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify complete history for vacancy proof and chronology
        run: test "$(git rev-parse --is-shallow-repository)" = "false"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install test runner
        run: python -m pip install --upgrade pytest

      - name: Run internal Document-ID, vacancy-gate, ambiguity-census, chronology, namespace-lineage, and provenance-census tests
        env:
          PYTHONPATH: ${{ github.workspace }}/Quality/Integration
        run: >-
          python -m pytest -q
          Quality/Integration/test_internal_document_id_audit.py
          Quality/Integration/test_ejr_allocation_vacancy_gate.py
          Quality/Integration/test_ejr_ambiguity_source_signature_census.py
          Quality/Integration/test_ejr_h1_pair_chronology.py
          Quality/Integration/test_ejr_h1_multi_chronology.py
          Quality/Integration/test_ejr_h1_namespace_lineage.py
          Quality/Integration/test_ejr_nonmonotonic_provenance_census.py
          Quality/Integration/test_ejr_reverse_provenance_census.py

      - name: Emit deterministic audit report
        if: always()
        env:
          PYTHONPATH: ${{ github.workspace }}/Quality/Integration
        run: python Quality/Integration/internal_document_id_audit.py > internal-document-id-audit-report.json

      - name: Emit deterministic EJR ambiguity source-signature census
        if: always()
        env:
          PYTHONPATH: ${{ github.workspace }}/Quality/Integration
        run: python Quality/Integration/ejr_ambiguity_source_signature_census.py > ejr-ambiguity-source-signature-census.json

      - name: Emit deterministic EJR H1-pair chronology report
        if: always()
        env:
          PYTHONPATH: ${{ github.workspace }}/Quality/Integration
        run: python Quality/Integration/ejr_h1_pair_chronology.py > ejr-h1-pair-chronology.json

      - name: Emit deterministic EJR H1-multi chronology report
        if: always()
        env:
          PYTHONPATH: ${{ github.workspace }}/Quality/Integration
        run: python Quality/Integration/ejr_h1_multi_chronology.py > ejr-h1-multi-chronology.json

      - name: Emit deterministic EJR H1 namespace-lineage report
        if: always()
        env:
          PYTHONPATH: ${{ github.workspace }}/Quality/Integration
        run: python Quality/Integration/ejr_h1_namespace_lineage.py > ejr-h1-namespace-lineage.json

      - name: Emit deterministic EJR non-monotonic provenance census
        if: always()
        env:
          PYTHONPATH: ${{ github.workspace }}/Quality/Integration
        run: python Quality/Integration/ejr_nonmonotonic_provenance_census.py > ejr-nonmonotonic-provenance-census.json

      - name: Emit deterministic EJR reverse-direction provenance census
        if: always()
        env:
          PYTHONPATH: ${{ github.workspace }}/Quality/Integration
        run: python Quality/Integration/ejr_reverse_provenance_census.py > ejr-reverse-provenance-census.json

      - name: Upload deterministic audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: internal-document-id-audit-report
          path: internal-document-id-audit-report.json
          if-no-files-found: error

      - name: Upload deterministic EJR ambiguity source-signature census
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ejr-ambiguity-source-signature-census
          path: ejr-ambiguity-source-signature-census.json
          if-no-files-found: error

      - name: Upload deterministic EJR H1-pair chronology report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ejr-h1-pair-chronology
          path: ejr-h1-pair-chronology.json
          if-no-files-found: error

      - name: Upload deterministic EJR H1-multi chronology report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ejr-h1-multi-chronology
          path: ejr-h1-multi-chronology.json
          if-no-files-found: error

      - name: Upload deterministic EJR H1 namespace-lineage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ejr-h1-namespace-lineage
          path: ejr-h1-namespace-lineage.json
          if-no-files-found: error

      - name: Upload deterministic EJR non-monotonic provenance census
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ejr-nonmonotonic-provenance-census
          path: ejr-nonmonotonic-provenance-census.json
          if-no-files-found: error

      - name: Upload deterministic EJR reverse-direction provenance census
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ejr-reverse-provenance-census
          path: ejr-reverse-provenance-census.json
          if-no-files-found: error
