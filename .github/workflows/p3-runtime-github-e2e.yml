name: P3 Runtime GitHub E2E

on:
  push:
    branches:
      - 'e2e/runtime-srv009-*'
    paths:
      - '.github/workflows/p3-runtime-github-e2e.yml'
      - 'Services/**'
      - 'Runtime/**'
      - 'Tools/**'
      - 'Quality/E2E/**'
      - 'Quality/Integration/**'
      - 'Quality/Runtime/**'
      - 'Quality/Prototype/**'
      - 'p3_e2e_trigger.txt'

permissions:
  contents: write

jobs:
  runtime-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test runner
        run: python -m pip install --upgrade pytest

      - name: Execute ENG-006 -> SRV-009 runtime E2E
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/Runtime/Execution:${{ github.workspace }}/Runtime/Prototype
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from Services.GITHUB_REPOSITORY_CONNECTOR import GitHubConnectorConfig, GitHubRepositoryConnector
          from Services.ENG006_SRV009_PRODUCTION_ADAPTER import ProductionExecutionCandidate, execute_update

          owner, repo = os.environ['GITHUB_REPOSITORY'].split('/', 1)
          branch = os.environ['GITHUB_REF_NAME']
          token = os.environ['GITHUB_TOKEN']
          path = 'Quality/E2E/P3_RUNTIME_SRV009_LIVE_PROBE.md'

          config = GitHubConnectorConfig(owner=owner, repo=repo, token=token, branch=branch)
          connector = GitHubRepositoryConnector(config, timeout=30.0)

          create_candidate = ProductionExecutionCandidate(
              execution_id='E2E-P3-RUNTIME-001-CREATE',
              task_id='E2E-P3-RUNTIME-001',
              session_id='E2E-P3-2026-08-17',
              source_trace_id='E2E-SOURCE-TRACE-001',
              path=path,
              content='# P3 Runtime SRV-009 Live Probe\n\nState: CREATED\n',
              purpose='Isolated runtime verification only; non-canonical artifact.',
              necessity_evidence='P3 executable proof requires runtime invocation over real connector.',
              commit_message='P3 E2E runtime create probe',
              authorized=True,
          )
          create_result = execute_update(create_candidate, connector=connector)
          assert create_result['status'] == 'UPDATE_ACCEPTED', create_result
          assert create_result['execution']['trace']['final_status'] == 'UPDATE_ACCEPTED', create_result

          update_candidate = ProductionExecutionCandidate(
              execution_id='E2E-P3-RUNTIME-001-UPDATE',
              task_id='E2E-P3-RUNTIME-001',
              session_id='E2E-P3-2026-08-17',
              source_trace_id=create_result['execution']['execution_trace_id'],
              path=path,
              content='# P3 Runtime SRV-009 Live Probe\n\nState: UPDATED\n\nRuntime Adapter: VERIFIED\n',
              purpose='Isolated runtime verification only; non-canonical artifact.',
              necessity_evidence='Update must use observed current SHA and post-write read-back.',
              commit_message='P3 E2E runtime update probe',
              authorized=True,
          )
          update_result = execute_update(update_candidate, connector=connector)
          assert update_result['status'] == 'UPDATE_ACCEPTED', update_result
          assert update_result['execution']['trace']['final_status'] == 'UPDATE_ACCEPTED', update_result

          persisted = connector.read_back(path)
          assert 'State: UPDATED' in persisted.content
          print(json.dumps({
              'create': create_result['execution']['execution_trace_id'],
              'update': update_result['execution']['execution_trace_id'],
              'persisted_sha': persisted.sha,
              'branch': branch,
              'path': path,
          }, sort_keys=True))

          encoded = urllib.parse.quote(path, safe='')
          url = f'https://api.github.com/repos/{owner}/{repo}/contents/{encoded}?ref={urllib.parse.quote(branch)}'
          payload = json.dumps({'message': 'P3 E2E cleanup', 'sha': persisted.sha, 'branch': branch}).encode()
          request = urllib.request.Request(url, data=payload, method='DELETE')
          request.add_header('Accept', 'application/vnd.github+json')
          request.add_header('Authorization', f'Bearer {token}')
          request.add_header('X-GitHub-Api-Version', '2022-11-28')
          request.add_header('User-Agent', 'ARGO-KOP-P3-Runtime-E2E')
          with urllib.request.urlopen(request, timeout=30) as response:
              assert response.status in (200, 201)

          try:
              connector.read_back(path)
          except Exception as exc:
              assert 'GITHUB_READ_BACK_MISSING' in str(exc), str(exc)
          else:
              raise AssertionError('E2E cleanup did not remove the probe artifact')
          PY

      - name: Runtime E2E cleanup guard
        if: always()
        run: |
          echo "Runtime E2E branch: $GITHUB_REF_NAME"
          echo "No canonical artifact is permitted in this workflow."
