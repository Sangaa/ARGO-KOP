name: ARGO Runtime Prototype and Integration Tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'Runtime/Prototype/**'
      - 'Runtime/Execution/**'
      - 'Runtime/Learning/**'
      - 'Decision/**'
      - 'Cognition/**'
      - 'Memory/**'
      - 'Engine/**'
      - 'Services/**'
      - 'Interfaces/**'
      - 'AI/**'
      - 'Quality/Integration/**'
      - 'Governance/**'
      - 'Repository/**'
      - '.github/workflows/runtime-prototype-tests.yml'
  pull_request:
    paths:
      - 'Runtime/Prototype/**'
      - 'Runtime/Execution/**'
      - 'Runtime/Learning/**'
      - 'Decision/**'
      - 'Cognition/**'
      - 'Memory/**'
      - 'Engine/**'
      - 'Services/**'
      - 'Interfaces/**'
      - 'AI/**'
      - 'Quality/Integration/**'
      - 'Governance/**'
      - 'Repository/**'
      - '.github/workflows/runtime-prototype-tests.yml'

env:
  PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/Runtime/Execution:${{ github.workspace }}/Runtime/Learning:${{ github.workspace }}/Decision:${{ github.workspace }}/Cognition:${{ github.workspace }}/Memory/Execution:${{ github.workspace }}/Quality/Integration:${{ github.workspace }}/Runtime/Prototype

jobs:
  prototype-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Run prototype acceptance suite
        working-directory: Runtime/Prototype
        run: python -m pytest -q
      - name: Run canonical acceptance scenarios
        working-directory: Runtime/Prototype
        run: python run_acceptance_scenarios.py

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Run integration quality suite
        working-directory: Quality/Integration
        run: python -m pytest -q
