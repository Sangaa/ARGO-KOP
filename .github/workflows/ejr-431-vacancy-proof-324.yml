name: EJR-431 Vacancy Proof 324

on:
  push:
    paths:
      - 'p2_ejr431_vacancy_trigger.txt'

permissions:
  contents: read

jobs:
  prove-vacancy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify complete history
        run: test "$(git rev-parse --is-shallow-repository)" = "false"
      - name: Prove EJR-431 vacancy
        id: vacancy
        shell: bash
        run: |
          set +e
          python Quality/Integration/ejr_allocation_vacancy_gate.py EJR-431 > ejr-431-vacancy.json
          code=$?
          cat ejr-431-vacancy.json
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          decision=$(python - <<'PY'
          import json
          with open('ejr-431-vacancy.json', encoding='utf-8') as f:
              print(json.load(f).get('decision', 'UNKNOWN'))
          PY
          )
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload vacancy evidence
        uses: actions/upload-artifact@v4
        with:
          name: ejr-431-vacancy-proof
          path: ejr-431-vacancy.json
      - name: Enforce vacancy decision
        shell: bash
        run: test "${{ steps.vacancy.outputs.decision }}" = "VACANT"
