name: P4 REL-009 Consumer Boundary

on:
  workflow_dispatch:
  push:
    paths:
      - 'Repository/REP-014_REPOSITORY_RELATIONSHIP_REGISTRY.md'
      - 'Runtime/RUN-010_RUNTIME_REFERENCE.md'
      - 'Quality/P4/test_rel009_consumer_boundary.py'
  pull_request:
    paths:
      - 'Repository/REP-014_REPOSITORY_RELATIONSHIP_REGISTRY.md'
      - 'Runtime/RUN-010_RUNTIME_REFERENCE.md'
      - 'Quality/P4/test_rel009_consumer_boundary.py'

jobs:
  rel009-boundary:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Run REL-009 boundary safety gate
        run: python -m pytest -q Quality/P4/test_rel009_consumer_boundary.py
