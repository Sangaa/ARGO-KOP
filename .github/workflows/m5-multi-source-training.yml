name: M5 Multi-Source Intake Training
on:
  push:
    paths:
      - 'Runtime/Prototype/multi_source_m5_intake_harness.py'
      - 'Quality/Integration/test_multi_source_m5_intake_harness.py'
      - '.github/workflows/m5-multi-source-training.yml'
jobs:
  m5-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute deterministic M5 checks
        run: |
          python Runtime/Prototype/multi_source_m5_intake_harness.py
          python -m unittest -v Quality/Integration/test_multi_source_m5_intake_harness.py
