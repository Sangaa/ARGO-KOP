name: Full-Stack Repository Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  full-stack-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run P4 critical graph bidirectional boundary regression
        run: python Quality/Integrity/test_critical_graph_bidirectional_boundaries.py

      - name: Run P6 CI impact correlation regression
        run: python Quality/Integration/test_ci_impact_correlation.py

      - name: Run P6 layered boundary regressions via unittest discovery
        run: python -m unittest discover -s Quality/Integration -p 'test_p6_layered_boundaries.py' -v

      - name: Run P6 reconciliation boundary regressions via unittest discovery
        run: python -m unittest discover -s Quality/Integration -p 'test_p6_reconciliation_boundaries.py' -v

      - name: Run Mutation Matrix preflight regression
        run: |
          python - <<'PY'
          from check_mutation_matrix_preflight import evaluate
          assert evaluate(['Engine/ENG-TEST.md', 'EJR/EJR-TEST.md']) == (['Engine/ENG-TEST.md'], [])
          assert evaluate(['Engine/ENG-TEST.md', 'Repository/MUT-TEST_MUTATION_MATRIX.md']) == (['Engine/ENG-TEST.md'], ['Repository/MUT-TEST_MUTATION_MATRIX.md'])
          assert evaluate(['EJR/EJR-TEST.md', 'Docs/TEST.md']) == ([], [])
          assert evaluate(['Repository/MUT-TEST_MUTATION_MATRIX.md']) == ([], ['Repository/MUT-TEST_MUTATION_MATRIX.md'])
          print('MUTATION_MATRIX_PREFLIGHT_REGRESSION=PASS')
          PY
