name: Full-Stack Repository Audit

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/Runtime/Execution:${{ github.workspace }}/Runtime/Learning:${{ github.workspace }}/Decision:${{ github.workspace }}/Cognition:${{ github.workspace }}/Memory/Execution:${{ github.workspace }}/Quality/Integration:${{ github.workspace }}/Runtime/Prototype

jobs:
  repository-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run P4 REL-009 consumer boundary safety gate
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '| REL-009 |' Repository/REP-014_REPOSITORY_RELATIONSHIP_REGISTRY.md
          grep -Fq 'REVALIDATION REQUIRED' Repository/REP-014_REPOSITORY_RELATIONSHIP_REGISTRY.md
          grep -Fq 'relationship description' Runtime/RUN-010_RUNTIME_REFERENCE.md
          grep -Fq 'This is a relationship description, not a claim that every runtime operation follows this exact path.' Runtime/RUN-010_RUNTIME_REFERENCE.md

      - name: Run P4 negative runtime evidence gate
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('.')
          runner = (root / 'Runtime/Execution/connected_spine_runner.py').read_text(encoding='utf-8')
          entrypoint = (root / 'Runtime/Execution/execution_entrypoint.py').read_text(encoding='utf-8')
          assert 'action="SIMULATED_REVIEW"' in runner
          assert 'side_effect=False' in runner
          assert 'record_execution_trace' in entrypoint
          assert 'SRV-009' not in runner
          assert 'SRV-009' not in entrypoint
          PY

      - name: Run Mutation Matrix preflight regression
        run: |
          python - <<'PY'
          from check_mutation_matrix_preflight import evaluate
          assert evaluate(['Engine/ENG-TEST.md', 'EJR/EJR-TEST.md']) == (['Engine/ENG-TEST.md'], [])
          assert evaluate(['Engine/ENG-TEST.md', 'Repository/MUT-TEST_MUTATION_MATRIX.md']) == (['Engine/ENG-TEST.md'], ['Repository/MUT-TEST_MUTATION_MATRIX.md'])
          assert evaluate(['EJR/EJR-TEST.md', 'Docs/TEST.md']) == ([], [])
          assert evaluate(['Repository/MUT-TEST_MUTATION_MATRIX.md']) == ([], ['Repository/MUT-TEST_MUTATION_MATRIX.md'])
          print('MUTATION_MATRIX_PREFLIGHT_REGRESSION=PASS')
          PY

      - name: Run Mutation Matrix semantic regression
        run: |
          python - <<'PY'
          from check_mutation_matrix_semantics import validate_matrix_text
          from pathlib import Path
          valid = '''# MUTATION MATRIX — TEST
Transaction ID: `MUT-TEST-001`
Protocol: GOV-014 v1.0.1

| Change ID | Target | Action | Expected Content | Applied | Verified |
|---|---|---|---|:---:|:---:|
| TEST-001 | `Engine/ENG-TEST.md` | UPDATE | bounded test change | N | N |

## KEEP REQUIREMENT

All other content is `KEEP`.

## Execution Evidence

- Post-write read-back completed.
- Unexpected Changes = 0.

## Closure

`TEST TRANSACTION = CONTROLLED`.
'''
          invalid = valid.replace('| TEST-001 | `Engine/ENG-TEST.md` | UPDATE | bounded test change | N | N |', '| TEST-001 | `Engine/ENG-TEST.md` | UPDATE | bounded test change | MAYBE | N |')
          assert validate_matrix_text(valid) == []
          assert any('Applied must be Y or N' in e for e in validate_matrix_text(invalid))
          real_variants = [
              'Repository/MUT-2026-08-17-AUDIT-RECON-001_MUTATION_MATRIX.md',
              'Repository/MUT-2026-08-17-REP001-001_MUTATION_MATRIX.md',
              'Repository/MUT-2026-08-17-REP001-002_MUTATION_MATRIX.md',
          ]
          for path in real_variants:
              text = Path(path).read_text(encoding='utf-8')
              assert validate_matrix_text(text) == [], path
          print('MUTATION_MATRIX_SEMANTICS_REGRESSION=PASS')
          print('REAL_MATRIX_VARIANTS_VALIDATED=3')
          PY

      - name: Enforce Mutation Matrix on current change set
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.before }}"
          HEAD="${{ github.sha }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="$(git rev-parse HEAD^)"
          fi
          python Quality/Integration/check_mutation_matrix_preflight.py "$BASE" "$HEAD"

      - name: Execute repository-wide audit
        working-directory: Quality/Integration
        run: set -o pipefail; python run_full_stack_audit.py ../.. | tee ../../full-stack-audit-report.json

      - name: Emit real runtime evidence
        run: set -o pipefail; python Quality/Integration/emit_ci_runtime_evidence.py | tee ci-runtime-evidence.json

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: full-stack-audit-report
          path: full-stack-audit-report.json
          if-no-files-found: error

      - name: Upload runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: runtime-evidence
          path: |
            ci-runtime-evidence.json
            Quality/Integration/evidence/runtime/*.json
          if-no-files-found: error
