name: Real Mutation Matrix Regression
on:
  push:
    paths:
      - 'Quality/Integration/run_real_matrix_regression.py'
      - 'Quality/Integration/check_mutation_matrix_semantics.py'
      - 'Repository/*MUTATION_MATRIX*.md'
      - 'Repository/*CORRECTIVE_MATRIX*.md'
      - '.github/workflows/real-matrix-regression.yml'
jobs:
  real-matrix-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Execute real Matrix corpus validation
        run: python Quality/Integration/run_real_matrix_regression.py
